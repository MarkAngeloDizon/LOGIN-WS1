<!DOCTYPE html>
<html lang="en">
<head>
    <title>SNHS LMS</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="{{ url_for('static', filename='css/index.css') }}" rel="stylesheet">
</head>

<body>
    <div class="login-wrapper">
        <div class="login-container">

            <section class="logo">
                <img src="{{ url_for('static', filename='img/Untitled design.svg') }}" alt="SNHS LMS Logo">
                <p>Serenity National High School LMS</p>
            </section>

            <p>Please enter your credentials to login.</p>

            <form action="{{ url_for('login') }}" method="POST">

                <!-- CSRF token required by Flask -->
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ session.get('csrf_token', '') }}"
                >

                <div class="input-field">
                    <label for="email">Email:</label><br>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="input-field">
                    <label for="password">Password:</label><br>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <div class="input-field">
                    <input
                        type="checkbox"
                        id="remember"
                        name="remember"
                    >
                    <label for="remember">Remember me</label>
                    <a href="{{ url_for('reset') }}">Forgot password?</a>
                </div>

                <button type="submit">Login</button>

                <div class="register-link">
                    <p>
                        Don't have an account?
                        <a href="{{ url_for('register') }}">Register</a>
                    </p>
                </div>

            </form>
        </div>

        <div class="credentials">
            <h2>Account Credentials</h2>

            <section class="credpass">
                <h2>Email</h2>
                <h2>Password</h2>
                <h2>Role</h2>

                <h3>Admin@gmail.com</h3>
                <h3>12345678</h3>
                <h3>Admin</h3>

                <h3>Fbenosa@gmail.com</h3>
                <h3>12345678</h3>
                <h3>Teacher</h3>

                <h3>brianacebelarmino@gmail.com</h3>
                <h3>12345678</h3>
                <h3>Student</h3>
            </section>
        </div>
    </div>
</body>
</html>
